services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitness_dev
      POSTGRES_USER: ${DB_USERNAME:-fitness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitness}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fitness} -d fitness_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

#  redis:
#    image: redis:7-alpine
#    container_name: watchlist-redis
#    ports:
#      - "6380:6379"

volumes:
  postgres_data:
